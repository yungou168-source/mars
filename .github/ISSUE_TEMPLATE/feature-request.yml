name: 功能或文档建议
description: 提出可复现、可审查的改进建议
title: "[建议] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "感谢你的建议。请勿在公开 Issue 中提交凭据、用户数据、私有地址或安全漏洞细节。"
  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
      description: 当前体验、文档或扩展生态中有什么具体问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明预期行为、受影响用户和可接受的替代方案。
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options: [文档, 技能, 插件, 公开类型契约, 客户端发行说明, 其他]
    validations:
      required: true